appId: com.autoshoping.automation
productName: 自动上架工具
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
releaseInfo:
  releaseDate: "2026-10-01"
  releaseNotes: |
    【新功能】框选录制 & 自然语言控制
    - 新增框选录制功能：在页面截图上拖拽绘制红色矩形，自动识别区域内元素并录制为操作步骤
    - 录制完成后可一键回放，脚本自动按顺序执行所有步骤
    - 自然语言指令大幅扩展：支持双击、右键、后退、前进、截图、切换标签页、清空输入等
    【代码优化】全面精简代码结构
    - IPC 处理器提取通用 wrapper，消除 30 处重复 try/catch
    - 浏览器页面遍历逻辑统一收敛，消除 4 处重复
    - 批量操作处理器合并为通用函数
    - 任务 Store 提取 invokeAndReload 消除 10 处重复
    - 状态标签类型、渐变按钮样式提取为全局共享
