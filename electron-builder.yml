appId: com.autoshoping.automation
productName: 影随TraceFlow
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: TraceFlow
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 产物名固定为 Trace Flow（ASCII）：productName 是中文，默认名会带「影随TraceFlow」，
  # 上传 GitHub 后被 URL 编码，与 latest.yml 记录的文件名对不上，差分会退化成全量下载。
  # 注意用连字符而不是空格：electron-builder 写 latest.yml 时会把空格替换成「-」，
  # 空格只留在本地产物名上会让本地名和下载资产名不一致
  artifactName: Trace-Flow-Setup-${version}.${ext}
releaseInfo:
  releaseDate: "2026-10-03"
  releaseNotes: |
    【新增】地址栏可以直接输关键词
    - 输入内容不是网址时自动当成搜索词，点「前往」直接看结果页
    【新增】步骤执行节奏调整
    - 默认每个步骤执行完等 300 毫秒再进行下一步，仍可在步骤里单独自定义延迟
    【修复】切换到其他页面再回到操作录制，网页被重置
    - 录制页改为常驻，切到脚本管理、日志与设置后回来仍是原来那个页面，滚动位置和未保存的步骤都不丢
