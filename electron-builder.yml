appId: com.autoshoping.automation
productName: 影随TraceFlow
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
releaseInfo:
  releaseDate: "2026-10-02"
  releaseNotes: |
    【修复】应用内「版本信息」显示
    - 修复升级后「版本信息」内容未刷新的问题，现已正确显示当前版本号与更新说明
