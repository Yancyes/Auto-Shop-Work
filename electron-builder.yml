appId: com.autoshoping.automation
productName: 影随TraceFlow
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: TraceFlow
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  # 保留向导：首次安装完整包时让用户自己选安装路径。
  # 增量更新不受影响：updater 用 /S 静默调用同一个向导安装包，NSIS 会跳过所有页面
  # 并复用注册表里记录的上次安装目录，装完 --force-run 自动重启成新版本
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 产物名固定为 Trace Flow（ASCII）：productName 是中文，默认名会带「影随TraceFlow」，
  # 上传 GitHub 后被 URL 编码，与 latest.yml 记录的文件名对不上，差分会退化成全量下载。
  # 注意用连字符而不是空格：electron-builder 写 latest.yml 时会把空格替换成「-」，
  # 空格只留在本地产物名上会让本地名和下载资产名不一致
  artifactName: Trace-Flow-Setup-${version}.${ext}
releaseInfo:
  releaseDate: "2026-10-03"
  releaseNotes: |
    【新增】盯住屏幕上的一块区域，数据一变就停下来找你
    - 脚本可以配置多个监控区域：直接在屏幕上拖框选区，或上传一张现成截图作为基准
    - 判定分两路：屏幕画面比对（适合数字、库存、价格这类看图的变化）和页面关键词（适合文字出现/消失）
    - 监控可设巡检间隔与触发阈值，配置时可以「试测一次」立刻看到当前偏差有多大
    - 区域发生变化时，脚本会跑完当前这一步再停在原地等你，弹窗展示当时的画面和变化热区
    - 等待接管时可以直接跳过这一步，或者当场修改剩余步骤再继续跑，不用中断重来

    【新增】主界面可以收成置顶小窗
    - 录制和执行时都能一键缩成一个小窗，只留暂停/继续、结束等按钮，不挡页面也随时能收回来

    【新增】随机刷新步骤
    - 在指定位置插入刷新步骤，等待 30~60 秒之间的随机时长后刷新页面，避免固定节奏被识别
    - 等待期间同样可以暂停、跳过

    【优化】
    - 执行中的脚本可以实时修改步骤，改完当前这一步跑完就按新列表继续
    - 屏幕框选更稳定：多显示器与缩放比例下都能对准，遮罩卡死、选不到区域的问题已修复
