appId: com.autoshoping.automation
productName: 影随TraceFlow
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 产物用 ASCII 名：productName 是中文，默认名会带「影随TraceFlow」，
  # 上传 GitHub 后被 URL 编码，与 latest.yml 记录的文件名对不上，差分会退化成全量下载
  artifactName: auto-shoping-work-setup-${version}.${ext}
releaseInfo:
  releaseDate: "2026-10-03"
  releaseNotes: |
    【新增】多个脚本可以同时执行
    - 「最大并发数」设置现已生效，可同时跑 1-5 个脚本，每个脚本的进度独立显示、互不打断
    - 执行进度浮窗按脚本分别显示，多个脚本同时跑时浮窗会自动堆叠，单独停止某个脚本只收起它自己的浮窗
    - 脚本管理页可查看多个脚本的实时进度，暂停中的脚本计时会停住
    【新增】脚本可以复制副本
    - 脚本卡片新增「复制」，复制后会提示为副本命名，方便按店铺/系列批量建同类脚本
    【新增】找不到浏览器时可手动指定
    - 未检测到 Chrome/Edge 时，可直接选择浏览器程序路径，不再只能放弃执行
    【优化】执行设置真正生效
    - 「重试次数」：某个操作失败后会自动重试，重试仍失败才提示需要人工处理
    - 「反检测」三项（逐字输入、鼠标移动轨迹、随机延迟）按开关实际作用于回放
    - 「完成通知 / 需要人工处理时提醒 / 提示音」三项设置接入系统通知
    - 设置项补充了说明文字，并发数、执行间隔、重试次数的区别写清楚了
    【修复】保存脚本时填写的目标网址不生效
    【变更】移除执行截图功能
    【新增】可将运行日志保存位置改到自定义目录，保存后立即生效
