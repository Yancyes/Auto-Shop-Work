appId: com.autoshoping.automation
productName: 影随TraceFlow
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
releaseInfo:
  releaseDate: "2026-10-02"
  releaseNotes: |
    【重大更新】影随 TraceFlow 全新登场
    - 产品全面升级：从商品上架工具进化为通用的「网页操作录制 + 自动回放」助手
    - 一键录制：在内置浏览器中正常操作，自动记录点击、输入、选择、滚动等每一步
    - 步骤编辑：录制完成后可手动新增、删除、修改步骤，或上下调整顺序
    - 自动回放：保存为脚本后可一键全自动执行，支持重复运行多次
    - 脚本管理：集中查看、运行、删除已保存的脚本，实时显示执行进度
    - 全新应用图标与品牌视觉
