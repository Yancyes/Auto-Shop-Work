appId: com.autoshoping.automation
productName: 自动上架工具
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
releaseInfo:
  releaseDate: "2026-10-01"
  releaseNotes: |
    【修复】设置页面滚动问题
    - 修复系统设置页内容过长时无法滚动的问题，确保「版本与更新」区块可见
