appId: com.autoshoping.automation
productName: 自动上架工具
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
releaseInfo:
  releaseDate: "2026-10-01"
  releaseNotes: |
    【体验优化】自动更新全新体验
    - 新版本自动下载：启动应用后自动检测并下载更新，顶部实时显示下载进度与速度
    - 一键重启安装：下载完成后点击横幅即可重启安装，也可弹出查看更新内容后决定
    - 检查更新入口移至「系统设置」页面，方便管理版本
