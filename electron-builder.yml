appId: com.autoshoping.automation
productName: 影随TraceFlow
npmRebuild: false
directories:
  output: release
  buildResources: public
# 自动更新发布源（GitHub Releases）
# 发布新版本时，electron-builder 会自动上传到 GitHub Releases
publish:
  provider: github
  owner: Yancyes
  repo: Auto-Shop-Work
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: node_modules/playwright-core/bin
    to: playwright-core/bin
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/playwright-core
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 产物用 ASCII 名：productName 是中文，默认名会带「影随TraceFlow」，
  # 上传 GitHub 后被 URL 编码，与 latest.yml 记录的文件名对不上，差分会退化成全量下载
  artifactName: auto-shoping-work-setup-${version}.${ext}
releaseInfo:
  releaseDate: "2026-10-02"
  releaseNotes: |
    【新增】执行进度浮窗
    - 脚本运行时，在执行的浏览器上显示当前步骤、第几次和已耗时，不用再猜是不是卡住了
    - 暂停、轮次间隔也会实时提示，可在「日志与设置 → 脚本设置」中关闭
    【新增】已保存的脚本可以编辑步骤
    - 脚本管理页点「编辑步骤」即可增删改录制好的操作，保存后下次执行生效
    【修复】执行完成后界面状态不同步
    - 修复脚本执行完成后界面一直显示「正在执行」、脚本状态卡在「运行中」的问题
    - 修复部分情况下同一脚本被反复执行、执行次数虚增的问题
